const inp=document.getElementById("inp"),fRes=document.getElementById("fRes"),cRes=document.getElementById("cRes"),nBtn=document.getElementById("nBtn"),tip=document.getElementById("tip");
let curFlag="",curCode="",curNode="";

function copy(txt,lbl){if(!txt)return;navigator.clipboard.writeText(txt).then(()=>{tip.innerText=`✅ 已复制${lbl}到剪贴板！`;setTimeout(()=>tip.innerText="",2000)}).catch(()=>{})}

function renderFlag(code){
  if(P[code]) fRes.innerHTML=`<div class="flag-card">${P[code]}</div>`;
  else if(V[code]) fRes.innerHTML=`<div class="flag-card" style="background:linear-gradient(90deg,${V[code]})"></div>`;
  else if(H[code]) fRes.innerHTML=`<div class="flag-card" style="background:linear-gradient(${H[code]})"></div>`;
  else fRes.innerHTML=`<div class="flag-card" style="background:#3b82f6;color:#fff;align-items:center;justify-content:center;font-weight:bold">${code}</div>`;
}

function run(){
  const v=inp.value.trim();
  const code=C[v]||(/^[a-zA-Z]{2}$/.test(v)?v.toUpperCase():"");
  if(code){
    if(curCode!==code){
      curCode=code;
      curFlag=String.fromCodePoint(...code.split("").map(c=>127397+c.charCodeAt(0)));
      curNode=`${curFlag} | ${v} | ${curCode}`;
      renderFlag(code);
      cRes.innerText=curCode;
      nBtn.style.display="block";
      nBtn.innerText=`复制完整：| ${v} | ${curCode}`;
      copy(curFlag,"国旗");
    }
  }else{
    curCode="";curFlag="";curNode="";
    fRes.innerHTML='<span style="font-size:34px">🏳️</span>';
    cRes.innerText="--";nBtn.style.display="none";tip.innerText="";
  }
}
